name: checks

# Fast checks that need neither Buildroot nor the vendor blobs. A full image
# build takes the cross-toolchain from scratch and the proprietary files from
# firmware we do not ship, so it is not run here.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: No vendor files tracked
        # Everything under vendor/ except the MANIFEST comes from Caddx's
        # firmware and must never be committed.
        run: |
          tracked=$(git ls-files vendor | grep -v '^vendor/MANIFEST$' || true)
          if [ -n "$tracked" ]; then
            echo "vendor files are tracked - remove them:"; echo "$tracked"; exit 1
          fi

      - name: Shell syntax
        run: |
          for f in build.sh boot/mk-sd-image.sh scripts/release.sh \
                   br-external/board/ascent-vrx-pro/post-build.sh \
                   $(git ls-files 'br-external/board/ascent-vrx-pro/rootfs-overlay/etc/init.d/*') \
                   br-external/board/ascent-vrx-pro/rootfs-overlay/usr/sbin/fpvos-wifi \
                   br-external/board/ascent-vrx-pro/rootfs-overlay/root/bb-restart.sh \
                   br-external/board/ascent-vrx-pro/rootfs-overlay/ar8030soc/bb_only.sh \
                   br-external/board/ascent-lite/rootfs-overlay/usrdata/fpv/air/start.sh; do
            head -1 "$f" | grep -q bash && sh=bash || sh=sh
            $sh -n "$f" || { echo "syntax error: $f"; exit 1; }
          done

      - name: Python
        run: |
          python3 -m py_compile scripts/extract-ascent-vrx-pro-firmware.py boot/mkbootchain.py
          python3 scripts/extract-ascent-vrx-pro-firmware.py --help >/dev/null

      - name: AR9311 shell syntax
        run: |
          for f in $(git ls-files 'br-external/board/ascent-vrx/*' \
                     'br-external/board/common/ar9311/*' \
                     'br-external/package/ar9311-radio/src/*' \
                     'br-external/package/ascent-vrx-recovery/src/*' \
                     'br-external/package/fpvos-update/*'); do
            if head -1 "$f" | grep -q '^#!/bin/sh'; then
              sh -n "$f" || exit 1
            fi
          done

      - name: AR9311 host tools and updater tests
        run: |
          python3 -m py_compile boot/mkar9311img.py scripts/ar9311-ram-transfer.py
          python3 -m unittest discover -s tools/fpvos-update/tests -v

      - name: AR9311 firmware extraction tests
        run: python3 -m unittest discover -s br-external/package/ar9311-firmware/tests -v

      - name: P1 stock-runtime package checks
        run: |
          sh -n br-external/board/p1-air/source-rootfs-overlay/etc/init.d/S43factory
          python3 br-external/board/p1-air/tests/test_factory.py -v
          sh -n br-external/board/p1-air/source-rootfs-overlay/etc/init.d/S45settings
          sh -n br-external/package/kestrel-air/ar9311-run
          python3 br-external/board/p1-air/tests/test_settings.py -v
          sh -n br-external/board/p1-air/post-image.sh
          sh -n br-external/board/p1-air/rootfs-overlay/usrdata/fpv/air/root-login.sh
          python3 -m unittest discover -s br-external/package/p1-air-vendor/tests -v

      - name: Source camera white-balance checks
        run: |
          sh -n br-external/package/ar9311-camera-control/ar9311-camera-record
          python3 br-external/package/ar9311-camera-control/tests/test_awb.py -v
          cc -Wall -Wextra -Werror br-external/package/ar9311-camera-control/awbd.c \
             br-external/package/ar9311-camera-control/awb.c -lm -o /tmp/ar9311-awbd

      - name: Radio calibration provisioning tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjansson-dev
          python3 br-external/package/ar9311-radio/tests/test_calibration.py -v
          python3 -m py_compile br-external/package/p1-air-radio-config/configure.py
