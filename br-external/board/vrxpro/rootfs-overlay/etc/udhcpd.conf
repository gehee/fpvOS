# DHCP server for the USB gadget link (usb0), so a host plugged into the VRX
# gets an address automatically instead of needing a hand-configured one.
#
# The VRX itself is STATIC at 192.168.3.1 (see /etc/network/interfaces) and does
# NOT run a DHCP client on usb0 - running one was what kept wiping the address.
# This serves the *host*, nothing else.
interface       usb0
start           192.168.3.100
end             192.168.3.150
max_leases      51
lease_file      /var/lib/misc/udhcpd.leases
pidfile         /var/run/udhcpd.pid
option subnet   255.255.255.0
# No router/DNS on purpose: this is a point-to-point debug link, and handing the
# host a default route through the goggles would black-hole its normal traffic.
opt     lease   86400
