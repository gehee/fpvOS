# Clock configuration, read by /etc/init.d/S36rtc and /etc/init.d/S70kestrel.
#
# The pcf8563 is shared with the stock firmware, so what it holds is not
# negotiable: stock reads the registers as a wall clock and displays them as
# they are, and the factory set it to Beijing time. Rewriting it to UTC would
# make our clock right and stock's wrong by eight hours.
#
# So the chip is left alone and the offset is applied on our side instead. The
# system clock runs in real UTC - which is what Linux expects, and what makes
# file timestamps comparable with any other machine - and TZ turns that into
# local time for the OSD and for recording filenames.

# How far ahead of UTC the chip's wall clock is set, in minutes. 480 = UTC+8,
# the factory setting. Change this only if the chip itself is re-set to a
# different zone, e.g. by the phone app.
RTC_UTC_OFFSET_MIN=480

# Local timezone, as a POSIX TZ string. There is no tzdata on this rootfs, so
# an "America/Toronto" style name will NOT work - glibc needs the rules spelled
# out. The trailing fields are the DST changeover dates, so this follows DST on
# its own and needs no seasonal edit. The default is UTC; set yours below.
#   Toronto/New York : EST5EDT,M3.2.0,M11.1.0
#   Los Angeles      : PST8PDT,M3.2.0,M11.1.0
#   UK               : GMT0BST,M3.5.0/1,M10.5.0/2
#   Central Europe   : CET-1CEST,M3.5.0,M10.5.0/3
#   Beijing (no DST) : CST-8
#   None (show UTC)  : UTC0
TZ=UTC0
